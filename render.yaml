services:
  - type: web
    name: social-media-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: CORS_ORIGINS
        sync: false   # set manually in Render dashboard after you know the Vercel URL
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: LANGFLOW_API_URL
        sync: false
      - key: LANGFLOW_FLOW_ID
        sync: false
      - key: LANGFLOW_API_KEY
        sync: false
      - key: TWITTER_BEARER_TOKEN
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true
